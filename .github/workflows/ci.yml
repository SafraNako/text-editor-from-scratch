name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # vim is the oracle of the live comparison tests; pyte (a terminal emulator) draws the pty tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install vim
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq vim
          vim --version | head -1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -v
      - name: Benchmark (smoke run)
        run: python benchmarks/bench.py 2000
